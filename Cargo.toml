[workspace]
resolver = "2"
members = [
  "crates/bike-fit-app",
  "crates/bike-fit-core",
  "crates/bike-fit-ui",
  "crates/bike-fit-web",
]

[workspace.package]
version = "0.1.0"
authors = ["Fred"]
edition = "2021"
repository = "https://github.com/fredsystems/bike-fitter-1000"
license = "MIT OR Apache-2.0"

# All third-party deps are pinned to the exact patch version that resolved on
# the initial `cargo build`. Bumping a dep is a deliberate, reviewable change.
#
# `eframe` is declared without features here so each binary crate can opt into
# the platform-appropriate set: native binary picks wayland/x11/wgpu, the wasm
# crate picks just default_fonts + wgpu (WebGL via wgpu in the browser).
[workspace.dependencies]
eframe = { version = "0.29.1", default-features = false }
egui = "0.35.0"
env_logger = "0.11.10"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.0"
wasm-bindgen = "0.2.117"
wasm-bindgen-futures = "0.4.45"
web-sys = "0.3.72"
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
base64 = "0.22.1"

[profile.release]
lto = "thin"
codegen-units = 1
