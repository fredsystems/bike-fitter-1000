[workspace]
resolver = "2"
members = [
  "crates/bike-fit-app",
  "crates/bike-fit-core",
]

[workspace.package]
version = "0.1.0"
authors = ["Fred"]
edition = "2021"
repository = "https://github.com/fredsystems/bike-fitter-1000"
license = "MIT OR Apache-2.0"

# All third-party deps are pinned to the exact patch version that resolved on
# the initial `cargo build`. Bumping a dep is a deliberate, reviewable change.
[workspace.dependencies]
eframe = { version = "0.29.1", default-features = false, features = [
  "default_fonts",
  "wayland",
  "wgpu",
  "x11"
] }
egui = "0.29.1"
env_logger = "0.11.10"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "1.0.69"

[profile.release]
lto = "thin"
codegen-units = 1
