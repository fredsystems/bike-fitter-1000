[package]
name = "bike-fit-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# wasm-bindgen needs cdylib so the linker emits a .wasm file with the
# expected symbol shape. rlib lets us still `cargo test --lib` on host.
crate-type = ["cdylib", "rlib"]

[dependencies]
bike-fit-core = { path = "../bike-fit-core" }
bike-fit-ui = { path = "../bike-fit-ui" }
# Browser eframe: default_fonts (so we don't have to ship a TTF) plus the
# glow (WebGL2) backend. We deliberately skip the wgpu backend here:
#   - wgpu on web tries WebGPU first, then falls back to WebGL2 via wgpu's
#     own adapter logic, which silently fails on browsers/GPUs where
#     WebGPU isn't enabled and the WebGL2 path's adapter isn't picked up
#     ("no suitable adapter found").
#   - glow targets WebGL2 directly, which is universally supported, has
#     no adapter selection, and produces a noticeably smaller wasm.
# This app is 2D line art — wgpu's compute/3D capabilities buy us nothing.
eframe = { workspace = true, features = ["default_fonts", "glow"] }
egui.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
console_error_panic_hook.workspace = true
console_log.workspace = true
base64.workspace = true

[dependencies.web-sys]
workspace = true
features = [
  "Window",
  "Storage",
  "Location",
  "Document",
  "Url",
  "UrlSearchParams",
]
