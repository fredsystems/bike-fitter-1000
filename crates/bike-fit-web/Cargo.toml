[package]
name = "bike-fit-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# wasm-bindgen needs cdylib so the linker emits a .wasm file with the
# expected symbol shape. rlib lets us still `cargo test --lib` on host.
crate-type = ["cdylib", "rlib"]

[dependencies]
bike-fit-core = { path = "../bike-fit-core" }
bike-fit-ui = { path = "../bike-fit-ui" }
# Browser eframe: default_fonts (so we don't have to ship a TTF) plus the
# wgpu backend, which targets WebGL2/WebGPU at the browser layer. wayland/x11
# are deliberately omitted — they break the wasm32 build.
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
egui.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
console_error_panic_hook.workspace = true
console_log.workspace = true
base64.workspace = true

[dependencies.web-sys]
workspace = true
features = [
  "Window",
  "Storage",
  "Location",
  "Document",
  "Url",
  "UrlSearchParams",
]
